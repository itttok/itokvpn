port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895
ipv6: false
mode: rule
log-level: silent
allow-lan: true
external-controller: 0.0.0.0:9090
secret: DWD
bind-address: "*"
unified-delay: true
profile:
  store-selected: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: redir-host
  listen: 0.0.0.0:7874
  nameserver:
    - 1.1.1.1
    - 8.8.8.8
    - 112.215.203.254
    - 112.215.198.248
    - 112.215.198.254
    - 112.215.203.248
  fallback:
    - 1.0.0.1
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query
    - 112.215.203.254
    - 112.215.198.248
    - 112.215.198.254
    - 112.215.203.248
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
    - 112.215.198.248
    - 112.215.198.254
    - 112.215.203.248
    - 112.215.203.254
proxies:
- name: a
  server: vpnvip.nadia-lestari.my.id
  port: 443
  type: vless
  uuid: 5a3e60a8-5f14-4f64-ac28-f24a3e95316e
  cipher: auto
  tls: true
  skip-cert-verify: true
  servername: vplay.iflix.com
  network: ws
  alpn:
   - http/1.1
  ws-opts:
    path: "/vless-ws"
    headers:
     Host: vpnvip.nadia-lestari.my.id
  udp: true
- name: b
  type: vless
  server: 13.249.231.85
  port: 443
  uuid: 5a3e60a8-5f14-4f64-ac28-f24a3e95316e
  udp: true
  tls: true
  network: ws
  client-fingerprint: chrome
  servername: dnuziifot7vvr.cloudfront.net
  alpn:
   - http/1.1
  skip-cert-verify: true
  ws-opts:
    path: "/vless-ws/" 
    headers:
      Host: dnuziifot7vvr.cloudfront.net
proxy-groups:
  - name: URL-TEST
    type: url-test
    strategy: consistent-hashing
    disable-udp: true
    proxies:
      - a
      - b
    url: http://www.gstatic.com/generate_204
    interval: '10'
    tolerance: '15'
  - name: LOAD-BALANCE
    type: load-balance
    strategy: round-robin
    disable-udp: false
    proxies:
      - a
      - b
    url: http://www.gstatic.com/generate_204
    interval: '10'
  - name: SELECT
    type: select
    proxies:
      - a
      - b
  - name: FALLBACK
    type: fallback
    disable-udp: true
    proxies:
      - b
      - a
    url: http://www.youtube.com/generate_204
    interval: '100'
  - name: GLOBAL
    type: select
    proxies:
      - FALLBACK
rules:
  # Global
  - MATCH,GLOBAL