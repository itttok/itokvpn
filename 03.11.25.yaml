port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895
ipv6: false
mode: rule
log-level: silent
allow-lan: true
external-controller: 0.0.0.0:9090
secret: DWD
bind-address: "*"
unified-delay: true
profile:
  store-selected: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: redir-host
  listen: 0.0.0.0:7874
  nameserver:
    - 1.1.1.1
    - 8.8.8.8
    - 112.215.203.254
    - 112.215.198.248
    - 112.215.198.254
    - 112.215.203.248
  fallback:
    - 1.0.0.1
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query
    - 112.215.203.254
    - 112.215.198.248
    - 112.215.198.254
    - 112.215.203.248
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
    - 112.215.198.248
    - 112.215.198.254
    - 112.215.203.248
    - 112.215.203.254
proxies:
- name: 1
  server: id1-prem.kitu.my.id
  port: 443
  type: vless
  uuid: 4af24741-cefa-44ee-bab9-5ba2fe23fc95
  cipher: auto
  tls: true
  skip-cert-verify: true
  servername: vplay.iflix.com
  network: ws
  alpn:
   - http/1.1
  ws-opts:
    path: "/vless-ws/"
    headers:
     Host: id1-prem.kitu.my.id
  udp: true
- name: 2
  server: id1-prem.kitu.my.id
  port: 443
  type: vless
  uuid: 4af24741-cefa-44ee-bab9-5ba2fe23fc95
  cipher: auto
  tls: true
  skip-cert-verify: true
  servername: www.iflix.com
  network: ws
  alpn:
   - http/1.1
  ws-opts:
    path: "/vless-ws/"
    headers:
     Host: id1-prem.kitu.my.id
  udp: true
proxy-groups:
  - name: URL-TEST
    type: url-test
    strategy: consistent-hashing
    disable-udp: true
    proxies:
      - 1
      - 2
    url: http://www.gstatic.com/generate_204
    interval: '10'
    tolerance: '15'
  - name: LOAD-BALANCE
    type: load-balance
    strategy: round-robin
    disable-udp: false
    proxies:
      - 1
      - 2
    url: http://www.gstatic.com/generate_204
    interval: '10'
  - name: SELECT
    type: select
    proxies:
      - 1
      - 2
  - name: GLOBAL
    type: select
    proxies:
      - SELECT
      - LOAD-BALANCE
      - URL-TEST
rules:
  # Global
  - MATCH,GLOBAL
